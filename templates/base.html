<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}🧠 Resume Roastmaster{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        
        .glassmorphism {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .gradient-bg {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #334155 100%);
        }
        
        .hero-gradient {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
        }
        
        .roast-button {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a24 50%, #ff8e53 100%);
            animation: pulse 2s infinite;
        }
        
        .score-ring {
            background: conic-gradient(from 0deg, #ef4444 0deg, #f59e0b 120deg, #10b981 240deg, #3b82f6 360deg);
        }
        
        .terminal-bg {
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
        }
        
        .typewriter {
            overflow: hidden;
            border-right: 2px solid #fff;
            white-space: nowrap;
            animation: typing 3s steps(40, end), blink-caret 0.75s step-end infinite;
        }
        
        @keyframes typing {
            from { width: 0; }
            to { width: 100%; }
        }
        
        @keyframes blink-caret {
            from, to { border-color: transparent; }
            50% { border-color: #fff; }
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-30px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
        
        .fade-in-up {
            animation: fadeInUp 0.6s ease-out;
        }
        
        .slide-in {
            animation: slideIn 0.5s ease-out;
        }
        
        .floating-shapes {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: -1;
        }
        
        .shape {
            position: absolute;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 50%;
            animation: float 6s ease-in-out infinite;
        }
        
        .shape:nth-child(1) {
            width: 80px;
            height: 80px;
            top: 20%;
            left: 10%;
            animation-delay: 0s;
        }
        
        .shape:nth-child(2) {
            width: 120px;
            height: 120px;
            top: 60%;
            right: 10%;
            animation-delay: 2s;
        }
        
        .shape:nth-child(3) {
            width: 60px;
            height: 60px;
            top: 80%;
            left: 20%;
            animation-delay: 4s;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(180deg); }
        }
        
        .upload-area {
            transition: all 0.3s ease;
        }
        
        .upload-area:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
        }
        
        .upload-area.dragover {
            background: rgba(59, 130, 246, 0.1);
            border-color: #3b82f6;
        }
        
        .roast-line {
            opacity: 0;
            animation: roastAppear 0.5s ease-out forwards;
        }
        
        .roast-line:nth-child(1) { animation-delay: 0.2s; }
        .roast-line:nth-child(2) { animation-delay: 0.4s; }
        .roast-line:nth-child(3) { animation-delay: 0.6s; }
        .roast-line:nth-child(4) { animation-delay: 0.8s; }
        .roast-line:nth-child(5) { animation-delay: 1.0s; }
        
        @keyframes roastAppear {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
        
        .loading-bar {
            width: 0%;
            transition: width 0.3s ease;
        }
        
        .loading-bar.active {
            animation: loading 2s ease-in-out;
        }
        
        @keyframes loading {
            0% { width: 0%; }
            50% { width: 70%; }
            100% { width: 100%; }
        }
    </style>
</head>
<body class="gradient-bg min-h-screen text-white">
    <div class="floating-shapes">
        <div class="shape"></div>
        <div class="shape"></div>
        <div class="shape"></div>
    </div>
    
    <main class="container mx-auto px-4 py-8">
        {% block content %}{% endblock %}
    </main>

    <footer class="text-center py-8 opacity-60">
        <p class="text-sm">
            Built with ❤️ — No feelings were harmed in the making of this roast
        </p>
    </footer>

    <script>
        // Enhanced loading states and animations
        function showLoading() {
            const button = document.querySelector('button[type="submit"]');
            const loadingBar = document.getElementById('loading-bar');
            
            if (button) {
                button.innerHTML = '<i class="fas fa-fire mr-2"></i>🔥 Roasting in Progress...';
                button.disabled = true;
                button.classList.add('opacity-75');
            }
            
            if (loadingBar) {
                loadingBar.classList.add('active');
            }
            
            // Show loading section
            const loadingSection = document.getElementById('loading-section');
            if (loadingSection) {
                loadingSection.classList.remove('hidden');
                loadingSection.scrollIntoView({ behavior: 'smooth' });
            }
        }

        // Auto-resize textarea
        function autoResize(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = textarea.scrollHeight + 'px';
        }

        // Enhanced file selection with drag & drop
        function handleFileSelect(input) {
            const file = input.files[0];
            const fileInfo = document.getElementById('file-info');
            const uploadArea = document.querySelector('.upload-area');
            
            if (file) {
                fileInfo.innerHTML = `
                    <div class="flex items-center space-x-2 text-green-400">
                        <i class="fas fa-check-circle text-xl"></i>
                        <span class="font-medium">${file.name}</span>
                        <span class="text-sm opacity-75">(${(file.size / 1024 / 1024).toFixed(2)} MB)</span>
                    </div>
                `;
                fileInfo.classList.remove('hidden');
                fileInfo.classList.add('fade-in-up');
                
                // Clear textarea when file is selected
                const textarea = document.getElementById('resume_text');
                if (textarea) {
                    textarea.value = '';
                }
                
                // Update upload area
                if (uploadArea) {
                    uploadArea.classList.add('border-green-400');
                }
            } else {
                fileInfo.classList.add('hidden');
                if (uploadArea) {
                    uploadArea.classList.remove('border-green-400');
                }
            }
        }

        // Drag and drop functionality
        function setupDragAndDrop() {
            const uploadArea = document.querySelector('.upload-area');
            const fileInput = document.getElementById('resume_file');
            
            if (uploadArea && fileInput) {
                uploadArea.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    uploadArea.classList.add('dragover');
                });
                
                uploadArea.addEventListener('dragleave', () => {
                    uploadArea.classList.remove('dragover');
                });
                
                uploadArea.addEventListener('drop', (e) => {
                    e.preventDefault();
                    uploadArea.classList.remove('dragover');
                    
                    const files = e.dataTransfer.files;
                    if (files.length > 0) {
                        fileInput.files = files;
                        handleFileSelect(fileInput);
                    }
                });
            }
        }

        // Form validation
        document.addEventListener('DOMContentLoaded', function() {
            setupDragAndDrop();
            
            const form = document.querySelector('form');
            if (form) {
                form.addEventListener('submit', function(e) {
                    const fileInput = document.getElementById('resume_file');
                    const textInput = document.getElementById('resume_text');
                    
                    if (fileInput && textInput && !fileInput.files[0] && !textInput.value.trim()) {
                        e.preventDefault();
                        
                        // Show error message
                        const errorMsg = document.createElement('div');
                        errorMsg.className = 'text-red-400 text-sm mt-2 fade-in-up';
                        errorMsg.innerHTML = '<i class="fas fa-exclamation-triangle mr-1"></i>Please either upload a file or paste resume content.';
                        
                        const submitButton = form.querySelector('button[type="submit"]');
                        submitButton.parentNode.insertBefore(errorMsg, submitButton.nextSibling);
                        
                        setTimeout(() => {
                            errorMsg.remove();
                        }, 3000);
                        
                        return false;
                    }
                });
            }
        });

        // Smooth scroll to results
        function scrollToResults() {
            const resultsSection = document.getElementById('results-section');
            if (resultsSection) {
                resultsSection.scrollIntoView({ behavior: 'smooth' });
            }
        }
    </script>
</body>
</html>
